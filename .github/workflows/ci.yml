name: CI

on:
  pull_request:
  push:
    branches: [main]

# Only the newest run per branch or PR matters.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache-dependency-path: go.sum

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./...

      # The suite must never reach a real OpenTodo server (SPEC.md §11). The
      # live tests sit behind the `live` build tag; this proves they are still
      # excluded from the ordinary run *and* that they still compile, so a
      # dropped tag or a rotted test fails here instead of in someone's
      # account.
      - name: Live tests must stay opt-in
        run: |
          if go test ./... -list '.*' | grep -q '^TestLive'; then
            echo "::error::A live test is in the ordinary suite."
            echo "::error::Every test in internal/integration/live_test.go needs the live build tag."
            exit 1
          fi
          found=$(go test -tags live ./internal/integration -list '.*' | grep -c '^TestLive')
          echo "live tests behind the build tag: $found"
          if [ "$found" -eq 0 ]; then
            echo "::error::No live tests were found behind the build tag."
            exit 1
          fi
          go vet -tags live ./...

      - name: Shell scripts parse
        run: |
          for script in testing/*.sh deploy/k8s/kind/*.sh deploy/bin/*.sh \
                        deploy/k8s/base/keycloak/render-realm.sh \
                        containers/*.sh; do
            bash -n "$script" || exit 1
          done

      # The deployment manifests are not applied anywhere in CI; these only
      # check that they still build and parse.
      - name: Kubernetes overlays build
        run: |
          for overlay in deploy/k8s/overlays/*/; do
            cp "$overlay/secrets.env.example" "$overlay/secrets.env"
            kubectl kustomize "$overlay" > /dev/null || exit 1
            rm -f "$overlay/secrets.env"
          done

      - name: Ansible playbook parses
        run: |
          pipx install --quiet ansible-core
          cd deploy/quadlet
          ansible-playbook site.yml --syntax-check -e vault_file=vault.example.yml

  minimum-go:
    name: Minimum supported Go (1.24)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Matches the `go` directive in go.mod. A newer toolchain would silently
      # satisfy a newer language feature, so this job pins the floor.
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: go.sum

      - name: Build and vet
        env:
          # Refuse to download a newer toolchain: the point is to compile with
          # this one.
          GOTOOLCHAIN: local
        run: |
          go build ./...
          go vet ./...

  lint:
    name: Format and vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache-dependency-path: go.sum

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt would change: $unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@2025.1.1
          "$(go env GOPATH)/bin/staticcheck" ./...

  release:
    name: Release build
    # Only after the checks that can block: a release artifact is never built
    # from code that failed its tests.
    needs: [test, minimum-go, lint]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache-dependency-path: go.sum

      - name: Build
        env:
          CGO_ENABLED: "0"
        run: |
          go build -trimpath \
            -ldflags="-s -w -X main.version=$(git describe --tags --always --dirty)" \
            -o dist/tt ./cmd/tt

      - name: Smoke-test the binary
        run: |
          ./dist/tt --version
          ./dist/tt --help > /dev/null
          # With no OpenTodo client present, tt must fail cleanly with exit 7
          # rather than panicking or claiming success.
          set +e
          ./dist/tt --ot-command /nonexistent/ot status
          code=$?
          set -e
          if [ "$code" -ne 7 ]; then
            echo "::error::expected exit 7 for a missing ot client, got $code"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: tt-linux-x86_64
          path: dist/tt
          if-no-files-found: error
          retention-days: 30
