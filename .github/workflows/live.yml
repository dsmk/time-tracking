name: Live OpenTodo checks

# Never automatic. These need a real OpenTodo server, and the one step that
# cannot be scripted — creating the owner account — happens in a browser
# (see testing/README.md). Run this by hand from the Actions tab.
on:
  workflow_dispatch:
    inputs:
      run_live_tests:
        description: >-
          Run the `live`-tagged tests against the instance in the
          OPENTODO_URL and OPENTODO_TOKEN secrets. Requires a seeded instance.
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  # Starts the real image and checks it serves. Needs no account, so this one
  # always runs and is the cheapest way to notice an image or tag change.
  container-smoke:
    name: OpenTodo container starts and serves
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Start OpenTodo
        working-directory: testing
        run: docker compose up -d

      - name: Wait for /healthz
        run: |
          for _ in $(seq 1 60); do
            if curl -fsS http://localhost:8080/healthz > /tmp/healthz.json; then
              cat /tmp/healthz.json
              grep -q '"status":"ok"' /tmp/healthz.json && exit 0
            fi
            sleep 2
          done
          echo "::error::OpenTodo did not become healthy within 120s"
          docker compose -f testing/docker-compose.yml logs || true
          exit 1

      - name: Report the server version
        run: |
          echo "### OpenTodo test server" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/healthz.json >> "$GITHUB_STEP_SUMMARY"
          echo >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Stop OpenTodo
        if: always()
        working-directory: testing
        run: docker compose down -v

  # `ot schema` needs no server and no account, and answers most of the open
  # questions in docs/opentodo-compatibility.md §11. Captured as an artifact.
  capture-schema:
    name: Capture ot schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Install the OpenTodo CLI
        run: go install github.com/OpenTodoApp/opentodo/cmd/ot@latest

      - name: Capture
        run: |
          mkdir -p testing/findings
          "$(go env GOPATH)/bin/ot" version --json | tee testing/findings/version.json
          "$(go env GOPATH)/bin/ot" schema > testing/findings/schema.json
          echo "schema.json: $(wc -c < testing/findings/schema.json) bytes"

      - uses: actions/upload-artifact@v4
        with:
          name: ot-schema
          path: testing/findings/
          if-no-files-found: error

  live-tests:
    name: Live tests
    if: inputs.run_live_tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for an instance to talk to
        id: check
        env:
          OPENTODO_URL: ${{ secrets.OPENTODO_URL }}
          OPENTODO_TOKEN: ${{ secrets.OPENTODO_TOKEN }}
        run: |
          if [ -z "$OPENTODO_URL" ] || [ -z "$OPENTODO_TOKEN" ]; then
            echo "::notice::Skipped: set the OPENTODO_URL and OPENTODO_TOKEN secrets"
            echo "::notice::to a seeded throwaway instance (see testing/README.md)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-go@v5
        if: steps.check.outputs.ready == 'true'
        with:
          go-version: stable
          cache-dependency-path: go.sum

      - name: Install the OpenTodo CLI
        if: steps.check.outputs.ready == 'true'
        run: go install github.com/OpenTodoApp/opentodo/cmd/ot@latest

      - name: Seed and run
        if: steps.check.outputs.ready == 'true'
        env:
          OPENTODO_URL: ${{ secrets.OPENTODO_URL }}
          OPENTODO_TOKEN: ${{ secrets.OPENTODO_TOKEN }}
        run: |
          export OT="$(go env GOPATH)/bin/ot"
          ./testing/seed.sh --yes --force
          ./testing/run-live-tests.sh
