# Run ansible-playbook from this directory, or use the justfile.
#
# Nothing in this deployment needs an Ansible collection: ansible-core on the
# control machine, and podman on the target, are the whole dependency list.
# (That is also why stdout_callback is left at the default — the prettier
# `yaml` callback lives in community.general.)
[defaults]
inventory = inventory.yml
roles_path = roles
display_skipped_hosts = false
interpreter_python = auto_silent

[privilege_escalation]
become = true
become_method = sudo

[ssh_connection]
pipelining = true
