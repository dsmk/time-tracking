apiVersion: v1
kind: Service
metadata:
  name: keycloak
  labels:
    app.kubernetes.io/name: keycloak
spec:
  selector:
    app.kubernetes.io/name: keycloak
  ports:
    - name: http
      port: 8080
      targetPort: http
    # Health and metrics. Reachable in-cluster for probes and scraping only;
    # it is deliberately absent from the Ingress.
    - name: management
      port: 9000
      targetPort: management
