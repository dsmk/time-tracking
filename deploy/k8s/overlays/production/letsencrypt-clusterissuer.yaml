# Applied once per cluster, outside the overlay, because it is cluster-scoped
# and shared:
#
#   kubectl apply -f letsencrypt-clusterissuer.yaml
#
# Replace the email address. Let's Encrypt sends expiry warnings there.
#
# Test against the staging endpoint first if you are iterating on DNS — the
# production endpoint rate-limits failed authorizations hard:
#   https://acme-staging-v02.api.letsencrypt.org/directory
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: admin@example.com
    privateKeySecretRef:
      name: letsencrypt-account-key
    solvers:
      - http01:
          ingress:
            ingressClassName: nginx
