[package]
name = "tt"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
csv = "1.4.0"
directories = "6.0.0"
jiff = { version = "0.2.38", features = ["serde"] }
rusqlite = { version = "0.41.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.1.8"
uuid = { version = "1.29.0", features = ["v4"] }

[dev-dependencies]
serde_json = "1.0.154"
tempfile = "3.27.0"
