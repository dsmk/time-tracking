[package]
name = "tt"
version = "0.1.0"
edition = "2024"
description = "Terminal client for OpenTodo time tracking"
# 1.88 is the first release with let chains in edition 2024 (src/ot/model.rs,
# src/ot/mod.rs, src/main.rs). The CI msrv job verifies this.
rust-version = "1.88"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
csv = "1.4.0"
directories = "6.0.0"
jiff = { version = "0.2.38", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.1.8"

[dev-dependencies]
jiff = "0.2.38"
serde_json = "1.0.154"
tempfile = "3.27.0"
